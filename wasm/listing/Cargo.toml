# The listing: an NES cartridge (PRG and CHR) as assemblable text with
# markup in its comments, and the tools that write, load, check and render
# it (FORMAT.md is the standard). It reads a ROM and embeds no die data, so
# it is MIT like wasm/flow, whose opcode table it shares (one copy).
[package]
name = "listing"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "listing"
path = "src/main.rs"

[dependencies]
flow = { path = "../flow" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
